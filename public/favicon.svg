<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark-first #0b0b0b canvas rounded squircle with 1px #212121 hairline-soft border -->
  <rect width="64" height="64" rx="14" fill="#0b0b0b" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#212121" stroke-width="1.5" />
  
  <!-- Architectural "L" Monogram in pure white #ffffff -->
  <rect x="16" y="16" width="8" height="32" rx="2" fill="#ffffff" />
  <rect x="16" y="40" width="26" height="8" rx="2" fill="#ffffff" />
  
  <!-- Architectural Stack Layer in white/ash -->
  <rect x="28" y="28" width="20" height="8" rx="2" fill="#ffffff" opacity="0.9" />
  
  <!-- Signature Coral-Red Brand Dot #f36458 -->
  <circle cx="43" cy="19" r="6" fill="#f36458" />
</svg>
